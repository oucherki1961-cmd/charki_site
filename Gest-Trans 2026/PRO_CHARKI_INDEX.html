<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Gestion</title>
    <style>
        /* --- Variables de design --- */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* --- Reset et base --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
            
            /* Écriture inclinée pour tout le formulaire/page */
            font-style: italic;
        }

        /* --- En-tête et Titre --- */
        header {
            text-align: center;
            padding: 3rem 1rem 1rem 1rem;
            background: linear-gradient(to bottom, #ffffff, var(--bg-color));
        }

        /* Style du titre agrandi */
        h1.main-title {
            font-size: 7rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            letter-spacing: -3px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.4rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Conteneur principal --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Grille des boutons --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        /* --- Style des cartes/boutons --- */
        .nav-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
        }

        /* Icône */
        .icon-wrapper {
            width: 60px;
            height: 60px;
            background-color: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-card:hover .icon-wrapper {
            background-color: var(--primary-color);
            color: white;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            stroke-width: 2;
        }

        /* Typographie */
        .nav-card h2 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .nav-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: auto;
        }

        /* --- Responsive Mobile --- */
        @media (max-width: 600px) {
            h1.main-title {
                font-size: 4rem;
            }
            main {
                padding: 1rem;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
